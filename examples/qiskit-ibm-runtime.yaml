# Drafted by `prestige labels draft` from qiskit-ibm-runtime-mcp-tools.json. Review every line before use.
# Not set by the draft: trusted_output (tools that return only the user's own data) and fields
# (output fields the tool writes itself). Without them the guard blocks more, never less.

default: { impact: state, sinks: "*" }

tools:
  setup_ibm_quantum_account_tool: { impact: boundary, sinks: [channel, token] }
  list_backends_tool: { impact: read }
  least_busy_backend_tool: { impact: read }
  get_backend_properties_tool: { impact: read }
  get_backend_calibration_tool: { impact: read }
  get_coupling_map_tool: { impact: read }
  find_optimal_qubit_chains_tool: { impact: read }
  find_optimal_qv_qubits_tool: { impact: read }
  list_my_jobs_tool: { impact: read }
  get_job_status_tool: { impact: read }
  get_job_results_tool: { impact: read }
  cancel_job_tool: { impact: state, sinks: [job_id] }
  run_estimator_tool: { impact: boundary, sinks: [circuit, observables, backend_name, circuit_format, optimization_level, resilience_level] }
  delete_saved_account_tool: { impact: state, sinks: [account_name] }
  list_saved_accounts_tool: { impact: read }
  active_account_info_tool: { impact: read }
  active_instance_info_tool: { impact: read }
  available_instances_tool: { impact: read }
  usage_info_tool: { impact: read }
  run_sampler_tool: { impact: boundary, sinks: [circuit, backend_name, shots, circuit_format, dd_sequence] }

# Tool labels, AgentDojo v1.2.2 banking suite.
# Written Oct 29 2026 from the tool definitions, before any replay over the suites and before any guard run.
# A smoke test had already shown one banking injection task (injection_task_0). No Slack injection task had been read.
#
# impact:
#   read      no side effects
#   state     changes the user's own account
#   boundary  sends something outside the user's control
# sinks: arguments that decide where something goes. The guard checks these.
# trusted_output: the tool returns only the user's own account data. Other output is untrusted.
# Unlisted tools get `default`, which checks every argument.

# v3, Nov 2 2026: whole `sender` and `recipient` fields in the transaction list count as trusted. The
# bank writes those fields. Subject lines stay untrusted. Known cost: someone who pays the user gets
# their account into a trusted field. Nothing else changed.

default: { impact: state, sinks: "*" }

tools:
  get_iban: { impact: read, trusted_output: true }
  get_balance: { impact: read, trusted_output: true }
  get_user_info: { impact: read, trusted_output: true }
  get_scheduled_transactions: { impact: read, trusted_output: true }
  # Incoming transactions carry subject lines that other people write.
  get_most_recent_transactions: { impact: read, fields: [sender, recipient] }
  read_file: { impact: read }

  send_money: { impact: boundary, sinks: [recipient] }
  schedule_transaction: { impact: boundary, sinks: [recipient] }
  # Changing a scheduled payment's recipient redirects money.
  update_scheduled_transaction: { impact: boundary, sinks: [recipient] }

  update_password: { impact: state, sinks: [password] }
  # A changed address redirects the user's mail.
  update_user_info: { impact: state, sinks: [first_name, last_name, street, city] }

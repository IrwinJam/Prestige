name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  # A TypeScript agent on the OpenAI SDK, against a simulated gateway. No key, no spend.
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
        working-directory: examples/typescript
      - run: npm run check
        working-directory: examples/typescript
      - run: |
          prestige serve --simulate --labels banking --port 8787 --db /tmp/ts.sqlite &
          sleep 3
          cd examples/typescript && npx tsx agent.ts http://127.0.0.1:8787/s/ci-typescript/v1

  # The gateway image builds, starts and answers a request
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t prestige .
      - run: |
          docker run -d --name gateway -p 127.0.0.1:8787:8787 prestige
          sleep 5
          curl -sf http://127.0.0.1:8787/s/ci-docker/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{"model": "example-model", "messages": [{"role": "user", "content": "hi"}]}'
          docker logs gateway

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The action builds its range from the first pushed commit's parent and fails on the root commit.
      # Scan the full history with the CLI instead.
      - run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact -v .

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "prestige"
version = "0.1.0"
description = "Agent gateway that stops hijacked tool calls and cuts token cost."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    # Cost engine, pinned to the commit its published results came from.
    "agent-cost-harness @ git+https://github.com/IrwinJam/agent-cost-harness@576fe5e5dae738b53e84e37fea7532fda544501c",
]

[project.scripts]
prestige = "prestige.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
# Public attack benchmark. Installed, never copied in.
security = ["agentdojo==0.1.35"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["prestige"]

[tool.pytest.ini_options]
testpaths = ["tests"]
